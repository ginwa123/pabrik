<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!--
      The desktop app shell uses the host webview's native page-zoom
      (Ctrl+wheel / multi-finger pinch). The design canvas (the only
      place with its own zoom feature) calls `preventDefault()` on the
      wheel event inside its `@wheel` handler so the canvas-only zoom
      wins over the native page-zoom while the cursor is inside the
      canvas. See `DesignView.vue::handleCanvasWheel` for the canvas
      handler.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pabrik</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
