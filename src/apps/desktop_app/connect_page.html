<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect to Pabrik</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12120f;
    --card: #1D1C19;
    --border: #282727;
    --text: #c5c9c5;
    --muted: #a6a69c;
    --accent: #8ba4b0;
    --accent-strong: #2D4F67;
    --error: #c4746e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, Cantarell, sans-serif;
  }
  .card {
    width: min(560px, 92vw);
    padding: 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .lede {
    margin: 0 0 24px;
    color: var(--muted);
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    font-variant-ligatures: none;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .note {
    min-height: 20px;
    margin: 10px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .note:empty { display: none; }
  .note[data-kind="error"] { color: var(--error); }
  .note[data-kind="pending"] { color: var(--accent); }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
  }
  button {
    padding: 10px 16px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }
  button.quiet { margin-left: auto; color: var(--muted); }
</style>
</head>
<body>
<main class="card">
  <h1>Connect to Pabrik</h1>
  <p class="lede">Enter the address of the Pabrik server this app should use.</p>
  <form id="connect-form" novalidate>
    <label for="server">Server address</label>
    <input id="server" name="server" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://pabrik.example.com" value="{{PREFILL}}" autofocus>
    <p id="note" class="note" role="status" aria-live="polite">{{NOTE}}</p>
    <div class="row">
      <button id="connect" class="primary" type="submit">Connect</button>
      <button id="local" type="button">Use local server</button>
      <button id="quit" class="quiet" type="button">Quit</button>
    </div>
  </form>
</main>
<script>
(() => {
  const form = document.getElementById('connect-form')
  const field = document.getElementById('server')
  const note = document.getElementById('note')
  const buttons = [
    document.getElementById('connect'),
    document.getElementById('local'),
    document.getElementById('quit'),
  ]

  const say = (text, kind) => {
    note.textContent = text
    if (kind) note.dataset.kind = kind
    else delete note.dataset.kind
  }

  const busy = (on) => {
    for (const button of buttons) button.disabled = on
  }

  const call = async (name, argument) => {
    try {
      return JSON.parse(await window[name](argument))
    } catch {
      return { ok: false, message: 'The desktop app did not answer. Reopen it and try again.' }
    }
  }

  const settle = async (result, pending) => {
    if (result && result.ok === true) {
      say(pending, 'pending')
      return
    }
    busy(false)
    say((result && result.message) || 'That server could not be used.', 'error')
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault()
    busy(true)
    await settle(await call('pabrikConnect', field.value), 'Connecting…')
  })

  document.getElementById('local').addEventListener('click', async () => {
    busy(true)
    const pending = 'Looking for a Pabrik server on this machine…'
    say(pending, 'pending')
    await settle(await call('pabrikUseLocal', ''), pending)
  })

  document.getElementById('quit').addEventListener('click', () => {
    window.pabrikQuit('')
  })
})()
</script>
</body>
</html>
