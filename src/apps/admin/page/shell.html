<!doctype html>
<!-- The shell: the document head, the masthead, the rail with its counts, the
     notice, and the panel a freshly minted password lands in. `admin_page.zig`
     joins these parts into the one page the console serves. This comment sits
     after the doctype on purpose: anything above it, even a comment, puts the
     document in quirks mode. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Admin console</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<header class="bg-paper">
  <div class="mx-auto max-w-[1180px] px-5 pt-7 pb-6 sm:px-7">
    <h1 class="animate-rise text-[30px] font-semibold leading-tight tracking-[-0.02em] text-cream motion-reduce:animate-none">Admin console</h1>
  </div>
</header>

<main class="mx-auto grid max-w-[1180px] gap-6 px-5 pt-6 pb-16 sm:px-7 lg:grid-cols-[300px_minmax(0,1fr)] lg:items-start lg:gap-7">

  <div class="flex flex-col gap-4 lg:sticky lg:top-6">

    <nav data-ui="sections" aria-label="Console sections" class="console-nav animate-rise rounded-card bg-surface p-2.5 motion-reduce:animate-none">
      <button type="button" class="nav-item" data-section="accounts" aria-pressed="true">Accounts</button>
      <button type="button" class="nav-item" data-section="machines" aria-pressed="false">Machines</button>

      <div class="console-figures mt-3 grid grid-cols-2 gap-x-4 gap-y-4 px-3 pt-3 pb-2">
        <div>
          <span class="block text-2xl font-semibold leading-none tabular-nums text-cream" id="count-total">0</span>
          <span class="mt-1 block text-sm text-ink-muted">accounts</span>
        </div>
        <div>
          <span class="block text-2xl font-semibold leading-none tabular-nums text-cream" id="count-active">0</span>
          <span class="mt-1 block text-sm text-ink-muted">may sign in</span>
        </div>
        <div>
          <span class="block text-2xl font-semibold leading-none tabular-nums text-cream" id="count-owners">0</span>
          <span class="mt-1 block text-sm text-ink-muted">owners</span>
        </div>
        <div>
          <span class="block text-2xl font-semibold leading-none tabular-nums text-cream" id="count-bots">0</span>
          <span class="mt-1 block text-sm text-ink-muted">bots</span>
        </div>
        <div class="col-span-2">
          <span class="block text-2xl font-semibold leading-none tabular-nums text-cream" id="count-sessions">0</span>
          <span class="mt-1 block text-sm text-ink-muted">live sessions</span>
        </div>
      </div>
    </nav>

  </div>

  <div class="min-w-0">

    <p id="notice" class="notice mb-4" role="status" hidden></p>

    <section data-ui="credential" id="credential-panel" aria-labelledby="credential-title" class="mb-4 rounded-card bg-surface p-6" hidden>
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between sm:gap-6">
        <h2 id="credential-title" class="text-xl font-semibold">Handed out</h2>
        <button type="button" id="credential-clear" class="shrink-0 rounded-card bg-surface-up px-4 py-2 transition-colors hover:bg-surface-hover">Hide it</button>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-3">
        <span id="credential-for" class="text-ink-muted"></span>
        <code id="credential-value" class="rounded-card bg-dim px-3.5 py-2 font-mono text-xl text-cream"></code>
        <span class="text-sm text-ink-muted">shown once</span>
      </div>
    </section>
