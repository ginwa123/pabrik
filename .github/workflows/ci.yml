# CI orchestrator. The graph, and nothing else.
#
#   changes ──▶ lint ──┬─▶ backend-linux   ──▶ functional-linux-{1,2,3}   ──┐
#                      ├─▶ backend-macos   ──▶ functional-macos-{1,2,3}   ──┤
#                      ├─▶ backend-windows ──▶ functional-windows-{1,2,3} ──┼─▶ ci-ok
#                      └─▶ android-apk ──▶ android-test ──────────────────┘
#
# WHAT CHANGED, AND WHY EACH ONE WAS WORTH THE CHURN
# ----------------------------------------------------
# 1. PER-PLATFORM CHAINS. `functional-test` used to `needs: backend`, and
#    `backend` was a 3-cell matrix — so the Linux functional suite could
#    not start until macOS AND Windows had finished, using neither of
#    their artifacts. A matrix has no per-cell dependency edge; a
#    workflow call does. The three backends are now three separate jobs
#    (`.github/workflows/ci-backend.yml`, called once per platform)
#    and each functional shard `needs:` exactly one of them.
#    Same for android: it needed the whole backend matrix and now needs
#    nothing but `lint`.
#
# 2. SHARDING. `functional-test` was the long pole at ~50 min. Three
#    shards per platform (nine jobs) drops the wall clock to roughly the
#    longest shard. The partition itself is in tests/conftest.py +
#    tests/func_shard.py; this file only passes shard_index/shard_total.
#    Each cell hands its shard to the build as `-Dfunc-shards` /
#    `-Dfunc-shard-index` (see ci-functional.yml); build.zig validates the
#    pair and sets the PABRIK_FUNC_SHARD_* variables the selector reads, so
#    the shard travels as a build input rather than as an inherited env var.
#
# 3. A CHEAP GATE FIRST. `changes` classifies the diff in ~15 s and
#    `lint` runs oxlint + eslint in ~3 min, before any 20-50 minute job
#    is scheduled. A docs-only change skips the heavy half entirely and
#    still produces one green run — unlike `on: paths-ignore`, which
#    would skip the whole workflow and leave the required check
#    permanently pending.
#
# 4. AGGRESSIVE CACHING. The two zig caches (build objects + the global
#    package cache), the pnpm store, the python venv and Playwright's
#    chromium are all keyed per runner image. Sharding only pays off
#    because a warm shard 3 costs a cache restore instead of a compile.
#
# 5. TIMEOUTS ON EVERY JOB. The backend job had none at all, so a wedged
#    runner held a machine for the default 6 hours.
#
# 6. ONE REQUIRED CHECK. `ci-ok` at the bottom is the only thing branch
#    protection needs to list, so the matrix can change shape without
#    anyone editing the ruleset.
#
# The two reusable workflows sit at the TOP level of .github/workflows and
# NOT in a subdirectory. A subdirectory looks tidier and is wrong: GitHub
# rejects the whole workflow with
#   invalid value workflow reference: workflows must be defined at the top
#   level of the .github/workflows/ directory
# and the symptom is a 0-second run with zero jobs and no check on the PR —
# which reads as "CI did not run" rather than "CI did not parse". That is
# what happened to ci.yml#747's first push; `uses:` paths in the PR body
# and in docs/ci.md are the only other places the path is written.
#
# Their only trigger is `workflow_call`, so neither can start a run by
# itself — they appear in the Actions tab as two entries that do nothing
# when clicked. That is the price of the per-platform dependency edges,
# and it is the whole trade: a matrix has no per-cell edge, a workflow
# call does.
#
# They also declare no `concurrency:` of their own — inside a called
# workflow `github.workflow` is the CALLER's name, so three calls would
# share one group and cancel each other. The single group below is the
# only one.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR when a new commit is pushed.
# ci-cancel-on-merge.yml mirrors this group literal to evict a merged
# PR's still-running jobs; keep the two in sync.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Only the two android jobs read this (the backend and functional cells
  # carry their own copy inside their reusable workflows, where it is the
  # only way to reach them). Keep the three copies in step: the emulator
  # suite boots a pabrik binary, and a build against an unpinned toolchain
  # is the one cell that stops reproducing what every other cell verifies.
  # pnpm migration (2026-08-28): npm (and the prior bun) are gone from CI
  # and build.zig. pnpm/action-setup pins pnpm 11; Node 24 + pnpm are the
  # only JS toolchain bits CI needs.
  ZIG_VERSION: 0.16.0

jobs:
  # ── 0. Path filter ───────────────────────────────────────────────────
  changes:
    name: path filter
    runs-on: ubuntu-latest
    # git diff plus 15 ms of selftest. The 5 is a backstop against a
    # runner that hangs on the network, not a real budget.
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - name: Checkout
        # Depth 2, not the default 1: the filter diffs against a BASE
        # commit, and depth 1 gives it nothing to diff against. On a
        # pull_request the checkout is the merge commit, whose first
        # parent is `pull_request.base.sha` — reachable at depth 2. On a
        # multi-commit push to main the base is not in the clone, and the
        # script fails open to heavy=true rather than guessing.
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify the change set
        id: filter
        shell: bash
        env:
          # One base per event, picked here rather than in three `if:`
          # gated steps: `github.event.before` is all-zeroes on a
          # branch's first push and absent on workflow_dispatch, and
          # ci-change-filter.sh already treats "no usable base" as
          # heavy=true.
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The filter decides whether anything gets built, so a filter
          # that has stopped classifying paths correctly is a silent
          # pipeline outage. 15 ms of insurance, run on every invocation.
          bash scripts/ci-change-filter.sh --selftest
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push)         base="$PUSH_BEFORE" ;;
            *)            base="" ;;
          esac
          # stdout is `heavy=true|false`; the per-file trace goes to
          # stderr and lands in this step's log.
          heavy="$(bash scripts/ci-change-filter.sh "$base")"
          echo "$heavy"
          echo "$heavy" >> "$GITHUB_OUTPUT"

  # ── 1. Lint ──────────────────────────────────────────────────────────
  lint:
    name: lint (oxlint + eslint)
    needs: changes
    # Documentation-only change: no JS changed, so there is nothing for
    # this job to say. `ci-ok` still reports the run green.
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js 24
        # Pinned to 24 to match the dev box and the backend cells.
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm 11
        # pnpm/action-setup is the canonical way to install pnpm on a
        # GitHub-hosted runner; the repo-root .npmrc pins
        # node-linker=hoisted, so no config_file input is needed.
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Cache pnpm store
        # Keyed on the lockfile only. The two other ubuntu jobs in this
        # run (the Linux backend cell and the Linux shards) use
        # `v1-pnpm-` / `v3-pnpm-` prefixes, and that is deliberate: an
        # actions/cache entry is written once and is immutable, so a
        # shared key would just mean whichever job finished first wins
        # and the rest report "already exists" — while a job that saves
        # a store another job is still writing into is a correctness
        # question nobody wants. This store is private to the lint job;
        # the point is that it is warm on the NEXT run, not that it is
        # shared inside this one.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: v4-lint-pnpm-${{ hashFiles('src/apps/desktop/pnpm-lock.yaml') }}
          restore-keys: |
            v4-lint-pnpm-

      - name: Install webapp dependencies
        shell: bash
        env:
          # Forced explicitly rather than left to pnpm's per-platform
          # default, so this cannot disagree with the cache path above.
          npm_config_store_dir: ${{ runner.temp }}/pnpm-store
        run: |
          set -euo pipefail
          command -v pnpm >/dev/null 2>&1 || { echo "x pnpm not on PATH -- pnpm/action-setup must have failed" >&2; exit 1; }
          command -v node >/dev/null 2>&1 || { echo "x node not on PATH -- setup-node must have failed" >&2; exit 1; }
          pushd src/apps/desktop >/dev/null
          pnpm install --frozen-lockfile
          popd >/dev/null

      - name: Lint (oxlint + eslint, fail-on-issue mode)
        # The gate .husky/pre-commit mirrors exactly — see that file.
        # `--fix` is deliberately NOT here: a linter that rewrites files
        # in CI produces a red build nobody can reproduce locally, and the
        # local hook runs the same fail-on-issue mode.
        #
        # `zig fmt --check` is NOT part of this gate, on purpose: the tree
        # is not fmt-clean today (many files under src/), so adding it
        # would turn every PR red on a change nobody made in that PR.
        # vue-tsc is not here either — it runs inside `pnpm run build` in
        # the backend cells, which is the project convention (the build is
        # the type-check).
        working-directory: src/apps/desktop
        shell: bash
        run: pnpm run lint:check

      - name: Install ripgrep
        # ubuntu-latest does NOT ship ripgrep, and the Zig coding-standards
        # scan below is a ripgrep one-liner. The script fails closed when
        # rg is absent (a lint that cannot run must never report the tree
        # clean), so without this step the job is red for an environmental
        # reason rather than a code one.
        #
        # The other jobs that need rg install it too — see the
        # "install ripgrep" steps in ci-backend.yml and ci-functional.yml,
        # which need it because src/modules/agent/tools/search.zig spawns
        # `rg` at runtime.
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            echo "ok ripgrep already at $(command -v rg)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
          command -v rg >/dev/null 2>&1 || { echo "x ripgrep still missing after install" >&2; exit 1; }
          rg --version | head -1

      - name: Zig coding standards (no `catch unreachable`)
        # The second half of this job's gate, and the one .husky/pre-commit
        # mirrors alongside the JS lint. The scan itself is ~50 ms; the
        # cost of this step is dominated by the ripgrep install above.
        #
        # The selftest runs first for the same reason the `changes` job
        # runs its own: a scanner that has stopped matching is a silent
        # outage, and the only way to notice is to check it against known
        # input on every invocation. It earned its keep immediately — the
        # first version of the script passed on a runner with no rg,
        # because `2>/dev/null || true` turned "command not found" into
        # "no matches".
        #
        # The rule and its rationale live in CODING_STANDARDS.md.
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/lint-no-catch-unreachable.sh --selftest
          bash scripts/lint-no-catch-unreachable.sh

  # ── 2. Backend, one job per platform ────────────────────────────────
  # Three calls of the same reusable workflow instead of one 3-cell
  # matrix. The `if` says three things at once, and each is load-bearing:
  #   * `needs.lint.result == 'success'` — a red lint skips 20-50 minute
  #     jobs. That is the "fails fast" half of the gate.
  #   * `needs.changes.outputs.heavy == 'true'` — documentation-only.
  #   * `!cancelled()` — a superseded run releases its machines instead
  #     of starting fresh ones.
  # Note what is NOT here: no `needs: backend`. Nothing consumes another
  # platform's artifacts, so nothing waits for another platform.
  backend-linux:
    name: backend (Linux X64)
    needs: [changes, lint]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    # softprops/action-gh-release needs write access to contents to create
    # or update `ci-latest`. Declared on BOTH sides on purpose: a called
    # workflow can only ever be granted permissions the caller already
    # holds, so setting it in only one place silently downgrades to the
    # workflow default of read.
    permissions:
      contents: write
    uses: ./.github/workflows/ci-backend.yml
    with:
      os: ubuntu-24.04
      label: Linux X64
      # glibc 2.39 on this image, which is what build.zig's pinned
      # .glibc_version = 2.38 needs.
      target_zig: x86_64-linux-gnu
      target_step: install:linux:system

  backend-macos:
    name: backend (macOS ARM64)
    needs: [changes, lint]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    permissions:
      contents: write
    uses: ./.github/workflows/ci-backend.yml
    with:
      os: macos-15
      label: macOS ARM64
      # `install:macos-arm`, not `install:macos` — the latter hardcodes
      # x86_64-macos in build.zig and the arm64 runner rejects the
      # result with "Bad CPU type in executable".
      target_zig: aarch64-macos
      target_step: install:macos-arm

  backend-windows:
    name: backend (Windows X64)
    needs: [changes, lint]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    permissions:
      contents: write
    uses: ./.github/workflows/ci-backend.yml
    with:
      os: windows-2022
      label: Windows X64
      # Native build, no target override: build.zig follows
      # b.graph.host.result on a Windows host and looks for the vcpkg
      # sysroot under C:\vcpkg\installed\x64-windows.
      target_zig: x86_64-windows-gnu
      target_step: install:windows-nat

  # ── 3. Functional, three shards per platform ────────────────────────
  # Each shard `needs:` ITS OWN backend cell and nothing else. This is the
  # change that makes the graph a set of per-platform chains instead of
  # one long tail: Linux shards start when Linux is green, not when the
  # slowest platform is.
  #
  # `!cancelled()` in the `if` is deliberate and is the second half of
  # that: because the `if` is explicit, it REPLACES the implicit
  # `success()`, so a red backend cell no longer reports this suite as
  # "skipped" instead of as a verdict. None of these jobs consumes a
  # backend artifact — each rebuilds from the same SHA via
  # `zig build functional-test-all` — so a backend failure carries no
  # information about whether the suites pass. (Run 36555002552 failed
  # `backend (Windows X64)` on a one-line compile error and all three
  # functional jobs reported "skipped".)
  #
  # SHARD_TOTAL is spelled out on every one of the nine jobs on purpose.
  # A `matrix:` cannot be used with `uses:`, so the repetition is the
  # price of the dependency edges, and a single typo in `shard_total`
  # would mean two shards of one platform covering different sets of
  # tests. tests/func_shard.py raises rather than selecting nothing when
  # an index is out of range, so the loud failure is at least guaranteed.
  #
  # 3 shards × 3 platforms = 9. Going to 4 is a one-character edit here
  # and in shard_total, and nothing else in the tree has to move.
  functional-linux-1:
    name: functional Linux X64 · shard 1/3
    needs: [changes, lint, backend-linux]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-functional.yml
    with:
      os: ubuntu-24.04
      label: Linux X64
      target_zig: x86_64-linux-gnu
      # ZERO-based. Out of range raises rather than collecting nothing.
      shard_index: 0
      shard_total: 3

  functional-linux-2:
    name: functional Linux X64 · shard 2/3
    needs: [changes, lint, backend-linux]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-functional.yml
    with:
      os: ubuntu-24.04
      label: Linux X64
      target_zig: x86_64-linux-gnu
      # ZERO-based. Out of range raises rather than collecting nothing.
      shard_index: 1
      shard_total: 3

  functional-linux-3:
    name: functional Linux X64 · shard 3/3
    needs: [changes, lint, backend-linux]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-functional.yml
    with:
      os: ubuntu-24.04
      label: Linux X64
      target_zig: x86_64-linux-gnu
      # ZERO-based. Out of range raises rather than collecting nothing.
      shard_index: 2
      shard_total: 3

  functional-macos-1:
    name: functional macOS ARM64 · shard 1/3
    needs: [changes, lint, backend-macos]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-functional.yml
    with:
      os: macos-15
      label: macOS ARM64
      target_zig: aarch64-macos
      # ZERO-based. Out of range raises rather than collecting nothing.
      shard_index: 0
      shard_total: 3

  functional-macos-2:
    name: functional macOS ARM64 · shard 2/3
    needs: [changes, lint, backend-macos]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-functional.yml
    with:
      os: macos-15
      label: macOS ARM64
      target_zig: aarch64-macos
      # ZERO-based. Out of range raises rather than collecting nothing.
      shard_index: 1
      shard_total: 3

  functional-macos-3:
    name: functional macOS ARM64 · shard 3/3
    needs: [changes, lint, backend-macos]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-functional.yml
    with:
      os: macos-15
      label: macOS ARM64
      target_zig: aarch64-macos
      # ZERO-based. Out of range raises rather than collecting nothing.
      shard_index: 2
      shard_total: 3

  functional-windows-1:
    name: functional Windows X64 · shard 1/3
    needs: [changes, lint, backend-windows]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-functional.yml
    with:
      os: windows-2022
      label: Windows X64
      target_zig: x86_64-windows-gnu
      # ZERO-based. Out of range raises rather than collecting nothing.
      shard_index: 0
      shard_total: 3

  functional-windows-2:
    name: functional Windows X64 · shard 2/3
    needs: [changes, lint, backend-windows]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-functional.yml
    with:
      os: windows-2022
      label: Windows X64
      target_zig: x86_64-windows-gnu
      # ZERO-based. Out of range raises rather than collecting nothing.
      shard_index: 1
      shard_total: 3

  functional-windows-3:
    name: functional Windows X64 · shard 3/3
    needs: [changes, lint, backend-windows]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-functional.yml
    with:
      os: windows-2022
      label: Windows X64
      target_zig: x86_64-windows-gnu
      # ZERO-based. Out of range raises rather than collecting nothing.
      shard_index: 2
      shard_total: 3

  # ── 4. Install, one job per platform ───────────────────────────────
  # Each job downloads the PREBUILT bins from the rolling `ci-latest`
  # release with the installer scripts under test (install.sh /
  # install.ps1 at this SHA — no build), then proves the installed
  # binary serves the browser URL. See ci-install.yml for why the
  # release bytes are not pinned to this SHA.
  #
  # Beside the backends, not under them: nothing here consumes a
  # backend artifact, so all three start alongside the builds.
  install-linux:
    name: install (Linux X64)
    needs: [changes, lint]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-install.yml
    with:
      os: ubuntu-24.04
      label: Linux X64
      target_zig: x86_64-linux-gnu

  install-macos:
    name: install (macOS ARM64)
    needs: [changes, lint]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-install.yml
    with:
      os: macos-15
      label: macOS ARM64
      target_zig: aarch64-macos

  install-windows:
    name: install (Windows X64)
    needs: [changes, lint]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    uses: ./.github/workflows/ci-install.yml
    with:
      os: windows-2022
      label: Windows X64
      target_zig: x86_64-windows-gnu

  # ── 5. Android, beside the backends rather than under them ──────────
  # Both android jobs used to `needs: backend`, so a 30-minute Gradle
  # build and a 45-minute emulator suite sat idle behind a macOS compile
  # that neither consumes. Neither consumes any backend artifact, so both
  # now hang off `lint` and start alongside the backends.

  android-apk:
    # Builds the Android client and publishes its apk onto the SAME rolling
    # `ci-latest` release the backend cells fill, so one page carries the
    # desktop binaries and the phone client.
    #
    # A SEPARATE job rather than a fourth platform in the backend chain.
    # Every step of `ci-backend.yml` reads `inputs.target_zig` /
    # `inputs.target_step` (cache key, staging dir name, release asset glob,
    # the `!= '__SKIP__'` smoke-test gate), so an Android entry there would
    # have to invent a zig triple to keep that shape -- and the triple would
    # be a lie, because nothing here is built by zig. The toolchain argues
    # the same way: JDK 17 + Gradle + the Android SDK are only worth standing
    # up on ubuntu-24.04.
    name: android-apk (ubuntu-24.04)
    needs: [changes, lint]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    runs-on: ubuntu-24.04
    # Same reason the backend job asks for it: softprops/action-gh-release
    # needs write access to contents to create or update the release, and the
    # workflow default is `contents: read`. Job-level, like backend's, so the
    # other jobs are unaffected.
    permissions:
      contents: write
    # WHY THERE IS NO `needs: backend` — this job sits beside the backends
    # in the graph instead of under them.
    #
    # It used to be sequenced strictly after all three backend cells for
    # exactly one reason: a GitHub Release row is last-writer-wins and
    # softprops/action-gh-release@v2 takes no lock over the tag, so this
    # job had to be LAST or it would replace the desktop install
    # instructions with an android-only body. That `needs:` also cost two
    # other things -- on PR #727 a red WINDOWS cell kept this job from
    # running at all, and a 30-minute Gradle build sat idle behind a
    # 25-minute macOS compile it does not consume.
    #
    # The ordering requirement is GONE because the body is no longer
    # inline here: every publisher now sends scripts/ci-release-body.md,
    # so all four send byte-identical text and it no longer matters which
    # one wins the create race.
    #
    # The `if:` that used to sit here now sits above, next to `needs:`.
    # A cold Gradle distribution download plus the whole AndroidX/Compose
    # dependency graph. Well inside this, and short of the default 360 so a
    # wedged dependency resolver releases the machine instead of sitting on
    # it for six hours.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # Load-bearing, not cosmetic, and the failure is undiagnosable: AGP
        # 8.7.3 rejects a newer JDK and aborts with a bare version number and
        # no stack trace -- on a machine defaulting to JDK 27 the entire error
        # message is `27`.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # `packages` is load-bearing for the same reason as in
        # android-functional-test: without it the action runs
        # `sdkmanager tools`, and Google removed that package, so sdkmanager
        # exits 1 with "Failed to find package 'tools'".
        # platforms;android-35 matches compileSdk = 35. build-tools;35.0.0 is
        # what actually assembles and signs the apk -- aapt2, zipalign and
        # apksigner all come from there, and nothing else in this job
        # produces a package.
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        # Caches the distribution AND the dependency graph, so the second run
        # of this job does not re-download the AndroidX/Compose tree.
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        # `assembleDebug`, not `assembleRelease`. There is no release
        # keystore in this repository and no signing secret configured, so
        # `:app:assembleRelease` yields an UNSIGNED apk that Android refuses
        # to install -- worse than useless on a release page, because it
        # looks like the artifact. Generating a keystore here would be worse
        # still: the SDK debug key is a well-known throwaway anyone can sign
        # with, and calling that "signed" would be a distinction without a
        # difference. So the apk is debug-signed, the ASSET NAME says
        # `-debug`, and the release body says it in words.
        #
        # No `-PpabrikBaseUrl`, on purpose: with the property absent the debug
        # variant falls back to the production host (app/build.gradle.kts), so
        # this apk talks to the same https://agent.ginwa.site a release build
        # would -- which is what makes it worth publishing to anyone. Passing
        # 10.0.2.2 here would bake a host that only means anything on a CI
        # emulator into the file every downloader gets.
        #
        # `./gradlew` is committed mode 100755, so it runs without a chmod
        # step, and `--console=plain` is what the functional Android suite
        # already passes, so the two Gradle invocations in this workflow
        # produce comparable logs.
        #
        # No `ci-install-linux-deps.sh` call: that script installs the
        # webview2 / sqlite / GTK / PostgreSQL stack that the ZIG build links.
        # Everything this build needs is the JDK plus the SDK packages above.
        working-directory: src/apps/android_mobile
        shell: bash
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Set up Python
        # The navgraph steps below read Kotlin source and compare the committed
        # audit page. `3.12` is what the functional Linux job already uses, so
        # the two agree on a version.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the navigation audit page is current
        # The committed `navgraph.html` is derived from `PabrikNavGraph.kt`, so an
        # edit to the NavHost without a `tools/navgraph/build.py` run leaves a
        # page that is confidently wrong. `--check` compares the committed
        # artifacts against a fresh render, masking the git sha so an unrelated
        # commit does not fail this job while a changed route does.
        run: python src/apps/android_mobile/tools/navgraph/build.py --check

      - name: Install the navgraph test dependency
        # `actions/setup-python` gives an interpreter, not a test framework, and
        # this job previously had no Python at all. The navgraph test is the
        # only Python the android build runs, so it installs the android suite's
        # requirements file rather than a bespoke one — that file already
        # documents itself as "the only Python dependency is the test framework
        # itself", and pytest is what it pins. A cold `pip install` of one
        # package; no venv, because nothing else in this job needs one.
        run: python -m pip install -q -r tests/functional_android/requirements.txt

      - name: Navgraph contract tests
        # No emulator and no backend: what is under test is Python reading
        # Kotlin, and the page is a static artifact. Here rather than in the
        # functional suite so a stale audit page fails this job instead of
        # waiting for an emulator.
        run: python -m pytest tests/functional_android/navgraph_contract_test.py -q

      - name: Stage the debug APK
        # Its own staging dir, matching the backend's `bin-stage-<triple>`
        # convention: four jobs publish to one release, and a shared
        # directory is a filename collision waiting for the first target
        # triple that repeats.
        #
        # Renamed on the way in, because the asset name is the only place the
        # debug-vs-release distinction survives once `app-debug.apk` is on
        # someone's phone. `Pabrik-` (capital) because this is the installable
        # app bundle, the same role `Pabrik-aarch64-macos.zip` plays for
        # Pabrik.app; the lowercase `pabrik-*` names all describe binaries you
        # run in a terminal, which is not what an apk is.
        shell: bash
        run: |
          set -euo pipefail
          src="src/apps/android_mobile/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$src" ]; then
            echo "✗ $src missing -- :app:assembleDebug produced no apk" >&2
            exit 1
          fi
          stage="bin-stage-android"
          mkdir -p "$stage"
          cp "$src" "$stage/Pabrik-android-debug.apk"
          ls -l "$stage"

      - name: Render the shared ci-latest release body
        # The same file the three backend cells send, for the same reason
        # (see the header of scripts/ci-release-body.md). Sending a
        # DIFFERENT body is what used to make this job the last writer,
        # and last-writer was what kept it off the critical path.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sed -e "s|@@SHA@@|$SHA|" -e "s|@@RUN@@|$RUN_ID|" \
            scripts/ci-release-body.md > "$RUNNER_TEMP/ci-latest-body.md"
          test -s "$RUNNER_TEMP/ci-latest-body.md"
          echo "rendered $(wc -l < "$RUNNER_TEMP/ci-latest-body.md") lines of release body"

      - name: Publish the APK to the rolling ci-latest release
        # Same release, same tag, same event gate as the backend job: a PR
        # builds and stages but never publishes -- zero quota usage, and a
        # pull_request from a fork has no write token at all. A broken Android
        # build SHOULD still go red on a PR, which is why the gate is on this
        # step and not on the job.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          # `prerelease` / `make_latest` are spelled out rather than left
          # implicit. Neither input has a `default:` in the action's action.yml,
          # so omitting `prerelease` makes v2 inherit it from the existing
          # release (`config.input_prerelease !== undefined ? ... :
          # existingRelease.prerelease`) and omitting `make_latest` sends
          # nothing at all. Both are harmless in the update path and both are
          # guesses in the CREATE path, so this job says what it means and
          # cannot become the one that decides whether the rolling release is
          # still a prerelease. (The create path IS reachable from here --
          # this job can win the race to create the tag -- and the shared
          # body file is what makes that safe.)
          # Byte-identical to what the three backend cells send, which is
          # what makes the ORDER between the four publishers irrelevant.
          # A GitHub Release row is last-writer-wins and v2 takes no lock
          # over the tag, so before this file existed the only safe order
          # was "android last, and android never writes a body" -- and
          # "android last" meant `needs: backend`, which is exactly the
          # gate this job no longer has.
          name: CI binaries (latest main)
          body_path: ${{ runner.temp }}/ci-latest-body.md
          prerelease: true
          make_latest: false
          # The ONE thing this publisher contributes. Its own staging dir,
          # matching the backend cells' `bin-stage-<triple>` convention:
          # four jobs publish to one release, and a shared directory is a
          # filename collision waiting for the first repeat.
          files: bin-stage-android/*

  android-test:
    # The Android client's functional UI suite: a real `pabrik` binary against an
    # isolated tmpdir HOME, ten scenarios seeded into that instance's own
    # `agent.db`, and the **real MainActivity** driven on an emulator with
    # assertions on the rendered Compose tree.
    # See docs/superpowers/plans/2026-09-27-android-functional-ui-test.md.
    #
    # Emulator-only by construction, not by preference: the debug APK is built
    # to reach the host at 10.0.2.2, which is the *emulator's* alias for this
    # machine's loopback interface, so a physical device cannot run it. The
    # suite refuses to guess — tests/functional_android/conftest.py skips with
    # that reason when it cannot find an emulator.
    #
    # This is the gate that keeps the suite from rotting. It was written as a
    # local-only suite first, and an emulator-only test that nobody runs is the
    # failure this job exists to prevent: the module already learned that lesson
    # once, when `PabrikNavGraphLaunchGateTest` sat unrun on an emulator while
    # two bugs survived a green build.
    #
    # The unit tests are a *different* job (the `android-unit-test` job in
    # flight as PR #654). This one covers only what needs a device.
    name: android-test (ubuntu-24.04)
    # Chained after android-apk, and after NOTHING else. It used to
    # `needs: backend` too, for the same reason android-apk did: it
    # consumes no backend artifact — it builds its own pabrik with
    # `zig build install:linux` two steps below.
    #
    # The emulator suite is the more valuable of the two android signals,
    # so the `if:` says `!cancelled()` rather than requiring
    # `needs.android-apk.result == 'success'`: a red Gradle build upstream
    # must not turn ten scenarios into "skipped". That is the same reason
    # the functional shards run under `!cancelled()` behind a red backend.
    needs: [changes, lint, android-apk]
    if: ${{ needs.lint.result == 'success' && needs.changes.outputs.heavy == 'true' && !cancelled() }}
    runs-on: ubuntu-24.04
    # A cold AVD boot, one Gradle build + install, then ten scenarios. The
    # jobs above are ~5 min; an emulator is a different order of magnitude and
    # the default 360 would cut a working run off at the boot.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        # A GitHub-hosted runner is a fresh VM per job, so every job installs
        # its own. The list is shared rather than copy-pasted — see the script.
        run: bash scripts/ci-install-linux-deps.sh

      - name: Set up JDK 17
        # Load-bearing, not cosmetic. AGP 8.7.3 rejects a newer JDK and aborts
        # with a bare version number and no stack trace — on a machine
        # defaulting to JDK 27 the whole error message is `27`.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # `packages` is load-bearing: without it the action runs
        # `sdkmanager tools`, and Google removed that package, so sdkmanager
        # exits 1 with "Failed to find package 'tools'". Listing what we need
        # skips that call. platforms;android-35 matches compileSdk = 35.
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        # Caches the distribution and the dependency graph. Without it every run
        # re-downloads the whole AndroidX/Compose tree.
        uses: gradle/actions/setup-gradle@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Python 3.12
        # Minor-pinned, NOT patch-pinned: `setup-python` resolves '3.12' to
        # the latest patch (3.12.14 -> 3.12.15 during the Oct 2026 toolcache
        # rollout). A venv is only valid for the EXACT interpreter that
        # created it, so the venv cache key below is scoped to the full
        # version resolved here.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve full Python version for the venv cache key
        id: py-full
        shell: bash
        run: |
          ver=$(python3 --version 2>/dev/null || python --version 2>/dev/null)
          echo "version=${ver#Python }" >> "$GITHUB_OUTPUT"

      - name: Cache the python venv
        # Shares the key prefix with the other two suites so this job restores
        # the venv `functional-test` already built instead of making a third
        # cold one. Caches are immutable, so the first job to finish saves and
        # the rest simply get "Cache already exists".
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pabrik-ci-venv
          # Scoped by IMAGE (`ubuntu-24.04`), not by `runner.os`. The
          # comment above claimed this job shared a key prefix with the
          # functional suites and therefore restored their venv instead of
          # building a cold one — and it did not: those keys are
          # `v3-py-ubuntu-24.04-py312-` (image) while this restore-key was
          # `v2-py-Linux-py312-` (os, and a stale major version), so the
          # prefix could not match and every run paid a cold venv. Both
          # halves now say `ubuntu-24.04`.
          #
          # The `py<full-version>` segment (not just `py312`) is
          # load-bearing: a venv's `bin/python` symlinks into the EXACT
          # toolcache interpreter that created it, so a venv restored
          # under a different patch (3.12.14 -> 3.12.15 in the Oct 2026
          # rollout) has dangling links and `python3 -m venv` over it
          # exits 1 (CI runs 37713928128 / 37760720058, including this
          # job). The restore-key is scoped to the same full version —
          # a cross-patch prefix restore would reintroduce the breakage.
          key: v4-py-ubuntu-24.04-py${{ steps.py-full.outputs.version }}-android-${{ hashFiles('tests/functional/requirements.txt', 'tests/functional_android/requirements.txt') }}
          restore-keys: |
            v4-py-ubuntu-24.04-py${{ steps.py-full.outputs.version }}-

      - name: Enable KVM
        # GitHub-hosted Linux runners do expose /dev/kvm, but the runner user
        # cannot open it until it is in the `kvm` group. Skipping this gives a
        # permissions error that reads like broken hardware acceleration.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the pabrik binary the harness boots
        # `install:linux` produces `zig-out/bin/pabrikcore-linux-x86_64`, which
        # is the target-triple-named artifact — NOT the unqualified `pabrik`
        # that the default `install` step writes. Same command the other
        # functional jobs' build path uses.
        run: zig build install:linux

      - name: Install the suite's python dependencies
        env:
          PABRIK_FUNC_VENV_DIR: ${{ runner.temp }}/pabrik-ci-venv
        run: |
          set -euo pipefail
          if [ ! -x "$PABRIK_FUNC_VENV_DIR/bin/python" ]; then
            # `--clear`: the dir may hold a cached venv whose interpreter
            # symlinks dangle after a Python patch rotation — plain
            # `python3 -m venv` over it exits 1 (CI runs 37713928128 /
            # 37760720058).
            python3 -m venv --clear "$PABRIK_FUNC_VENV_DIR"
          fi
          "$PABRIK_FUNC_VENV_DIR/bin/pip" install -q -r tests/functional/requirements.txt
          "$PABRIK_FUNC_VENV_DIR/bin/pip" install -q -r tests/functional_android/requirements.txt

      - name: Run the functional UI suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The exact artifact `zig build install:linux` installs. Note the
          # name: `install:linux` produces `pabrikcore-linux-x86_64`, NOT
          # `pabrik` — `pabrik` comes from the default `install` step that
          # `install:linux:system` and the functional-test job use. Pinning the
          # wrong one here would still pass, because the suite's resolver falls
          # through to the other candidates, which is exactly why it is worth
          # naming the right file: a silent fallback hides a broken pin.
          PABRIK_BIN: ${{ github.workspace }}/zig-out/bin/pabrikcore-linux-x86_64
          PYTHONPATH: tests/functional:tests/functional_ui:tests/functional_android
          PABRIK_FUNC_VENV_DIR: ${{ runner.temp }}/pabrik-ci-venv
        with:
          # Matches compileSdk. A mismatch between the emulator's API level and
          # the one the app was built against is a device-only failure that
          # nobody can reproduce locally.
          api-level: 35
          target: google_apis
          arch: x86_64
          # The action's own default boot timeout is shorter than a cold boot on
          # a loaded runner.
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          # ONE physical line, and that is the whole constraint.
          #
          # android-emulator-runner@v2 is a Node action, and it does not hand
          # this input to a shell. `parseScript` in its src/script-parser.ts
          # splits the string on newlines, trims each line, DROPS every line
          # starting with `#`, then main.ts runs each survivor as its own
          # `exec.exec('sh', ['-c', line])`. One shell per line, no state
          # shared between them.
          #
          # That is what killed this step twice, and neither failure was in
          # pytest. `set -euo pipefail` on its own line ran under dash (this
          # is `/usr/bin/sh`), which has no `pipefail`: `/usr/bin/sh: 1: set:
          # Illegal option -o pipefail`, 4 minutes after a cold emulator boot.
          # Rewriting it to `set -eu` only traded one illusion for another —
          # `-e` and a `status=0` assignment die with the shell that set them —
          # and the trailing `\` line-continuation survived as a LITERAL
          # argument, so pytest exited 4 with `ERROR: file or directory not
          # found: \`.
          #
          # So: one line, `;`-separated, no continuation, no `pipefail`, and
          # no `tee` (`$?` after a pipe is tee's status, not pytest's). The
          # redirect is what writes the log the "Upload the reports" step
          # picks up, `cat` puts it in the job log either way, and the
          # explicit `exit` is what carries pytest's verdict out — the
          # action's own `exec.exec` throws on a non-zero status, so a bare
          # last-line `cat` would have reported success on a failed suite.
          # These `#` lines are stripped by `parseScript`, so they cost
          # nothing.
          script: |
            "$PABRIK_FUNC_VENV_DIR/bin/python" -m pytest tests/functional_android/ -q -rs > /tmp/android-functional-test.log 2>&1; status=$?; cat /tmp/android-functional-test.log; exit $status

      - name: Upload the reports
        # `if: always()` so a failing run still publishes the instrumented JUnit
        # XML and the pytest log instead of only a red check.
        #
        # `continue-on-error` because artifact storage is an account-level quota
        # this repo does not control, and hitting it turned an otherwise green
        # run red before. The report is a diagnostic; the gate is the step above.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: android-functional-test-report
          path: |
            /tmp/android-functional-test.log
            src/apps/android_mobile/app/build/outputs/androidTest-results/
            src/apps/android_mobile/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  # ── 5. The one required check ───────────────────────────────────────
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Every job above, by name. Listing them here is the price of one
    # aggregate check: a new job that is NOT added to this list will not
    # hold up a merge, so a new heavy job has to be added in two places.
    # That is a fair trade for branch protection listing one context
    # instead of thirteen, and for being able to change the shard count
    # without editing a ruleset.
    needs:
      - changes
      - lint
      - backend-linux
      - backend-macos
      - backend-windows
      - functional-linux-1
      - functional-linux-2
      - functional-linux-3
      - functional-macos-1
      - functional-macos-2
      - functional-macos-3
      - functional-windows-1
      - functional-windows-2
      - functional-windows-3
      - install-linux
      - install-macos
      - install-windows
      - android-apk
      - android-test
    # `always()` is mandatory, not defensive. `ci-ok` IS the required
    # check, so if it is skipped the PR is stuck on a check that will
    # never report — a docs-only change would do exactly that.
    if: ${{ always() }}
    steps:
      - name: Aggregate the upstream results
        shell: bash
        env:
          # One multi-line value rather than sixteen `env:` keys: it is the
          # same list as `needs:` above (written twice by hand either way),
          # and `job=result` lines read far better in a log than a
          # numbered array.
          #
          # `needs.<job>.result` is a closed enum (success / failure /
          # skipped / cancelled), so interpolating it into shell input
          # carries nothing that would need quoting.
          RESULTS: |
            changes=${{ needs.changes.result }}
            lint=${{ needs.lint.result }}
            backend-linux=${{ needs.backend-linux.result }}
            backend-macos=${{ needs.backend-macos.result }}
            backend-windows=${{ needs.backend-windows.result }}
            functional-linux-1=${{ needs.functional-linux-1.result }}
            functional-linux-2=${{ needs.functional-linux-2.result }}
            functional-linux-3=${{ needs.functional-linux-3.result }}
            functional-macos-1=${{ needs.functional-macos-1.result }}
            functional-macos-2=${{ needs.functional-macos-2.result }}
            functional-macos-3=${{ needs.functional-macos-3.result }}
            functional-windows-1=${{ needs.functional-windows-1.result }}
            functional-windows-2=${{ needs.functional-windows-2.result }}
            functional-windows-3=${{ needs.functional-windows-3.result }}
            install-linux=${{ needs.install-linux.result }}
            install-macos=${{ needs.install-macos.result }}
            install-windows=${{ needs.install-windows.result }}
            android-apk=${{ needs.android-apk.result }}
            android-test=${{ needs.android-test.result }}
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            echo "  $entry"
            case "$entry" in
              *=failure)
                failed=1
                ;;
              *=cancelled)
                # Not fatal: a superseded run is cancelled wholesale and
                # GitHub does not gate on it. Worth saying out loud though,
                # because "everything skipped" and "everything cancelled"
                # look identical in the checks list otherwise.
                echo "::warning::a job was cancelled — the run was superseded"
                ;;
            esac
          done <<< "$RESULTS"
          if [ "$failed" -ne 0 ]; then
            echo "::error::ci-ok: at least one job failed"
            exit 1
          fi
          # A docs-only change lands here with every heavy job skipped.
          # That is a pass, not a gap: the jobs were skipped BY DECISION,
          # and the decision is recorded in the `changes` job's log.
          echo "ci-ok: no failures"
